# Tested stable releases as of 2026-10-21. Keep the installed device's 1 MB FS layout.
default_profile: modern
profiles:
  modern:
    notes: ESP8266 current libraries; NodeMCU 0.9, 80 MHz, 4 MB flash / 1 MB SPIFFS
    fqbn: esp8266:esp8266:nodemcu:eesz=4M1M,xtal=80
    platforms:
      - platform: esp8266:esp8266 (3.1.2)
        platform_index_url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
    libraries:
      - ArduinoJson (7.4.3)
      - PubSubClient (2.8.0)
      - WiFiManager (2.0.17)
      - WebSockets (2.7.2)
      - Stepper_28BYJ_48 (1.0.0)
